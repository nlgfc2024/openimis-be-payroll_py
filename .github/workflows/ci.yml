name: Module CI
# Runs this module's tests inside the Malawi backend assembly. The steps live in one
# shared workflow on the hub, so CI fixes are made there once:
# https://github.com/nlgfc2024/openimis-be_py/blob/mw/develop/.github/workflows/ci_module.yml
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - mw/develop
      - jobs-now/develop
      - umep/develop
      - 'release/mw/**'
  workflow_dispatch:

jobs:
  call:
    name: Malawi CI
    uses: nlgfc2024/openimis-be_py/.github/workflows/ci_module.yml@mw/develop
